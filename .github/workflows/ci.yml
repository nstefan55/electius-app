name: CI

# Launch subset of the pipeline design — docs/2026-08-30/ci-cd-pipeline.md (committed) and
# context/ci-cd-pipeline/electius-ci-cd-pipeline-spec.md §4 (working spec, not in the repo).
# Four gates on every push and PR, no stored secrets. Deploys are NOT here — Vercel's
# Git integration deploys main (pull model); this workflow only decides whether
# a commit is green. `npm run build` is deliberately absent: it needs
# NEXT_PUBLIC_* and Vercel already builds every push.
#
# workflow_dispatch and the weekly schedule exist for secret-scan: on a manual or
# scheduled run gitleaks scans the FULL history; on push it scans only the pushed range
# with --first-parent, so a locally merged --no-ff branch is never scanned unless the
# branch itself was pushed first. Rule: push the feature branch before `git merge --no-ff`;
# the schedule is the structural backstop for the day the rule is forgotten.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC — full-history secret scan. Runs from the default branch only; may be delayed under load

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}   # event-aware: a push to main must never cancel the scheduled scan, or vice versa
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write                   # actions/upload-code-coverage — the only job that needs it
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json   # reads engines.node — the ONE Node pin
          cache: npm
      - run: npm ci
      - run: npx prisma generate            # lint + tsc need src/generated/prisma; exits 0 with no DB env
      - run: npm run lint
      - run: npm run typecheck              # tsc --noEmit — the class of error Vitest cannot see
      - run: npm run test:coverage          # the same suite as `npm run test`, plus a cobertura report

      # Feeds the `code_coverage` rule on the `main` ruleset. Scope is src/actions + src/lib
      # (vitest.config.ts): invariant #8 says those are the only things this repo tests, so a
      # whole-src percentage would be measuring components that deliberately have none.
      # A fork PR's token is read-only, so the ACTION exits 0 there rather than failing.
      - name: upload coverage report
        # PRs and main only: ci.yml fires on bare push AND pull_request, so a branch with an open
        # PR would otherwise upload the same report twice. Forks need no clause here — the action
        # skips them itself (verified in the run log: "Skipping coverage upload for fork PR").
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest
          # ponytail: false until Settings > Security > Code quality > "Code coverage analysis"
          # is switched on — until then there is nowhere to upload to, and a gate must not go red
          # over a toggle nobody has flipped. Flip to true once the first report lands.
          fail-on-error: false

  migration-presence:
    # Enforces "never db push" at source: a schema change must carry a migration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: schema.prisma changed without a migration?
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || echo "$BASE" | grep -Eq '^0+$'; then
            echo "No base commit to diff against — skipping."; exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Base $BASE is not in history (force-push?) — skipping."; exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          if echo "$CHANGED" | grep -q '^prisma/schema.prisma$' \
             && ! echo "$CHANGED" | grep -q '^prisma/migrations/'; then
            echo "::error::prisma/schema.prisma changed but no migration was committed. Run 'prisma migrate dev' — never 'db push'."
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read                   # private repo: v3 lists PR commits on pull_request events
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                      # so commits[0]^ resolves; full history only on workflow_dispatch and schedule
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"          # v3 defaults to 8.24.3, which silently ignores [[allowlists]]; this is the binary .gitleaks.toml was verified against
          GITLEAKS_ENABLE_COMMENTS: "false"   # PR comments would need pull-requests: write; the exit code is the gate
          # GITLEAKS_LICENSE: organisation accounts only — this is a personal account
          # Known false positives are allowlisted in .gitleaks.toml at the repo root

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  pr-hygiene:
    # PR-only: both checks need a base commit to diff against, and both turn a rule this project has
    # kept by hand for 55 versions into a red X. See context/features/ci-cd-pr-pipeline.md §4.2.
    # No npm install: node is preinstalled on the runner and neither check needs the project's deps.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: version bumped above the base?
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}   # through env, never interpolated into the script
        run: |
          BASE_V="$(git show "$BASE_SHA:package.json" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')"
          HEAD_V="$(node -p 'require("./package.json").version')"
          LOCK_V="$(node -p 'require("./package-lock.json").version')"
          if [ "$HEAD_V" != "$LOCK_V" ]; then
            echo "::error::package.json ($HEAD_V) and package-lock.json ($LOCK_V) disagree. Bump with 'npm version <level> --no-git-tag-version' so both move together, never by hand."
            exit 1
          fi
          # sort -V orders X.Y.Z numerically; the base must sort first AND differ from the head.
          LOWEST="$( { echo "$BASE_V"; echo "$HEAD_V"; } | sort -V | head -1 )"
          if [ "$HEAD_V" = "$BASE_V" ] || [ "$LOWEST" != "$BASE_V" ]; then
            echo "::error::version $HEAD_V is not above the base $BASE_V. Every branch that lands bumps the version (context/ai-interaction.md, Versioning): feature/ -> minor, fix/ and chore/ -> patch."
            exit 1
          fi
          echo "version $BASE_V -> $HEAD_V"

      - name: forbidden paths in the diff?
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"
          BAD="$(echo "$CHANGED" | grep -E '^(context/|[.]env|[.]claude/agent-memory/|[.]claude/settings[.]local[.]json|[.]claude/skills/|CLAUDE[.]md$|AGENTS[.]md$)' || true)"
          if [ -n "$BAD" ]; then
            echo "::error::these paths must never reach the repo. Unstage them and amend:"
            echo "$BAD"
            exit 1
          fi
          echo "no forbidden paths"
